<text x="35" y="38" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="2" fill="#d7f4f1">// THE SIGNAL PATH</text>
<text x="1160" y="38" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="1" fill="#789aa5">CURRENT ARCHITECTURE / V1 TRANSITION</text>
