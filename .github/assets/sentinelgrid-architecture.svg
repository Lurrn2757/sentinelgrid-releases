<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="at ad">
<title id="at">SentinelGrid system architecture</title>
<desc id="ad">Current metrics flow uses agents, ingestion, PostgreSQL and Grafana. Current alert sources include an external Zabbix adapter. Sentinel Engine V1 remains in development.</desc>
