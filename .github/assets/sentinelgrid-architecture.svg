<text x="343" y="283" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#edf9f7">ALERT ADAPTER</text>
<text x="343" y="302" font-family="monospace" font-size="11" fill="#83a4ad">incident lifecycle</text><rect x="619" y="222" width="254" height="97" rx="10" fill="#0c1c29" stroke="#2e6071" stroke-width="1.4"/>
<path d="M635 237 h27" stroke="#5cebd3" stroke-width="2"/>
<text x="635" y="256" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#79a5b0">03 / ROUTE</text>
<text x="635" y="283" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#edf9f7">NOTIFICATIONS</text>
<text x="635" y="302" font-family="monospace" font-size="11" fill="#83a4ad">stateful delivery</text><rect x="911" y="222" width="254" height="97" rx="10" fill="#0c1c29" stroke="#2e6071" stroke-width="1.4"/>
<path d="M927 237 h27" stroke="#5cebd3" stroke-width="2"/>
<text x="927" y="256" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#79a5b0">04 / ACT</text>
<text x="927" y="283" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#edf9f7">TELEGRAM</text>
