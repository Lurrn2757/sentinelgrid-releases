<path d="M51 89 h27" stroke="#5cebd3" stroke-width="2"/>
<text x="51" y="108" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#79a5b0">01 / COLLECT</text>
<text x="51" y="135" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#edf9f7">HOST AGENTS</text>
<text x="51" y="154" font-family="monospace" font-size="11" fill="#83a4ad">on-host metrics</text><rect x="327" y="74" width="254" height="97" rx="10" fill="#0c1c29" stroke="#2e6071" stroke-width="1.4"/>
<path d="M343 89 h27" stroke="#5cebd3" stroke-width="2"/>
