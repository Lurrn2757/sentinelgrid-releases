<text x="343" y="135" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#edf9f7">INGESTION API</text>
<text x="343" y="154" font-family="monospace" font-size="11" fill="#83a4ad">validated telemetry</text><rect x="619" y="74" width="254" height="97" rx="10" fill="#0c1c29" stroke="#2e6071" stroke-width="1.4"/>
<path d="M635 89 h27" stroke="#5cebd3" stroke-width="2"/>
