<text x="635" y="135" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#edf9f7">POSTGRESQL</text>
<text x="635" y="154" font-family="monospace" font-size="11" fill="#83a4ad">time-series + state</text><rect x="911" y="74" width="254" height="97" rx="10" fill="#0c1c29" stroke="#2e6071" stroke-width="1.4"/>
<path d="M927 89 h27" stroke="#5cebd3" stroke-width="2"/>
<text x="927" y="108" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#79a5b0">04 / EXPLORE</text>
<text x="927" y="135" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#edf9f7">GRAFANA</text>
<text x="927" y="154" font-family="monospace" font-size="11" fill="#83a4ad">trends + visibility</text><rect x="35" y="222" width="254" height="97" rx="10" fill="#0c1c29" stroke="#2e6071" stroke-width="1.4"/>
<path d="M51 237 h27" stroke="#5cebd3" stroke-width="2"/>
<text x="51" y="256" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#79a5b0">01 / EXTERNAL</text>
<text x="51" y="283" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#edf9f7">ZABBIX</text>
<text x="51" y="302" font-family="monospace" font-size="11" fill="#83a4ad">existing event source</text><rect x="327" y="222" width="254" height="97" rx="10" fill="#0c1c29" stroke="#2e6071" stroke-width="1.4"/>
<path d="M343 237 h27" stroke="#5cebd3" stroke-width="2"/>
